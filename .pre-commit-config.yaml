default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: fix
        name: Fix and stage changed files
        entry: bash -c 'make fix FILES="$*" && git add -- "$@"' --
        language: system
      - id: lint-sdk
        name: Lint SDK
        entry: make lint-sdk
        language: system
        pass_filenames: false
      - id: lint-workflows
        name: Lint changed workflows
        entry: make lint-workflows
        language: system
        pass_filenames: false
        files: '^\.github/workflows/'
      - id: test-unit-sdk
        name: Run SDK unit tests before pushing
        entry: bash -c 'unset $(git rev-parse --local-env-vars); exec make test-unit-sdk'
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: '^(Sources|Tests|server|protocol)/|^(Package\.|Makefile$|mise.toml$|\.swiftlint.yml$|\.swiftformat$)'
      - id: author
        name: Author uses personal email
        entry: >-
          sh -c 'case "$(git var GIT_AUTHOR_IDENT)" in
          *"<jai.g@ewa-services.com>"*|*"<jai.g@finn-app.com>"*)
          echo "Use jai@govindani.com in this personal repository" >&2; exit 1;; esac'
        language: system
        always_run: true
        pass_filenames: false
