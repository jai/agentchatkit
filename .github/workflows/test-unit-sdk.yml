name: test-unit-sdk
on:
  push:
    branches: [main]
    paths: ["Sources/**", "Tests/**", "Demo/**", "Package.swift", "Package.resolved", "Makefile", ".swiftlint.yml", ".swiftformat", "mise.toml", "cliff.toml", ".github/workflows/**", "server/**", "protocol/**"]
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13.1
      - name: Install server dependencies
        run: npm ci --prefix server --no-audit --no-fund
      - name: Run test-unit checks
        run: make test-unit-sdk
      - name: Remove disposable products
        if: always()
        run: rm -rf -- .build .venv Demo/build Demo/*.xcodeproj server/node_modules server/dist
