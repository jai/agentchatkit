name: release
# When ci passes on main, hourly, and by hand (at most one release an hour): tags and publishes main's newest CI-green commit when it holds unreleased
# feat or fix commits. PRHub and Agent Pager pin these tags. .github/scripts/release.sh picks the version.
on:
  # ci finished on main: release its commit now when it passed, instead of waiting for the cron. GitHub skips
  # scheduled runs for hours at a time (FeedbackKit's last one ran 2026-11-15 01:59 UTC), so the cron is the backup.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
concurrency: release
permissions:
  contents: write
  actions: read
jobs:
  release:
    # From ci, only a push to main that passed; the script still picks main's newest green commit.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    # GitHub's own runner: free for a public repo.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The jai-agents GitHub App token can create a tag over commits that change
      # .github/workflows; github.token cannot (no workflows permission).
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: 5757830
          private-key: ${{ secrets.JAI_AGENTS_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: release
        run: .github/scripts/release.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      # server/'s package goes on the release as its npm pack tarball, version = the tag. Hosts install it by URL:
      # https://github.com/jai/agentchatkit/releases/download/vX.Y.Z/jai-agentchat-live-X.Y.Z.tgz
      - if: steps.release.outputs.tag != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Attach the server package
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --tags --force
          git checkout "$TAG"
          cd server
          version="${TAG#v}"
          npm ci
          npm version "$version" --no-git-tag-version
          sed -i "s/PACKAGE_VERSION = \"0.0.0\"/PACKAGE_VERSION = \"$version\"/" src/handler.ts
          npm run build
          npm pack
          gh release upload "$TAG" "jai-agentchat-live-$version.tgz"
