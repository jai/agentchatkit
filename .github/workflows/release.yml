name: release
# The hourly release (jai/ci docs/workflow.md), through jai/trips-ci's shared hourly-release action: release-please
# writes the version and changelog commit, which lands on main with no pull request to merge, and a later run tags
# it vX.Y.Z and publishes the GitHub Release once that commit's own ci run passed. At most one release an hour.
# Started by jai/ci's release-clock Worker every hour, by ci passing on a push to main, and by hand.
# PRHub and Agent Pager pin these tags.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    # GitHub's own runner: free for a public repo.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The jai-agents GitHub App: it can land the release commit and tag commits that change .github/workflows.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: 5757830
          private-key: ${{ secrets.JAI_AGENTS_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - id: release
        uses: jai/trips-ci/.github/actions/hourly-release@f92911549596da8308152306e247e72c15ac8914 # main
        with:
          token: ${{ steps.app-token.outputs.token }}
          ci-workflow: ci.yml
          tag-prefix: v
      # server/'s package goes on the release as its npm pack tarball, version = the tag. Hosts install it by URL:
      # https://github.com/jai/agentchatkit/releases/download/vX.Y.Z/jai-agentchat-live-X.Y.Z.tgz
      - if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Attach the server package
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          git fetch --tags --force
          git checkout "$TAG"
          cd server
          version="${TAG#v}"
          npm ci
          npm version "$version" --no-git-tag-version
          sed -i "s/PACKAGE_VERSION = \"0.0.0\"/PACKAGE_VERSION = \"$version\"/" src/handler.ts
          npm run build
          npm pack
          gh release upload "$TAG" "jai-agentchat-live-$version.tgz"
