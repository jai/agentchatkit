name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  no-direct-networking:
    # Swift code here reaches the network only through DurableNetworking. The check is
    # jai/durable-networking's script, pinned to its v0.1.0 commit.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://raw.githubusercontent.com/jai/durable-networking/78cf3e6f488b7d0f37be0d684f122b5cc1c120f9/scripts/no-direct-networking.sh | bash -s -- .
  server:
    # The TypeScript server package (server/): its tests, the conformance suite on the in-memory host, and its tarball.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
  test:
    # GitHub's own Mac runner: free for a public repo.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  demo:
    # The demo app builds for the Mac, and its UI tests walk the chat's main flows on an iPhone simulator.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
        working-directory: Demo
      - name: Build the Mac app
        working-directory: Demo
        run: xcodebuild build -project AgentChatDemo.xcodeproj -scheme AgentChatDemo-macOS -destination 'platform=macOS' -quiet
      - name: UI tests on an iPhone
        working-directory: Demo
        run: |
          device=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test -project AgentChatDemo.xcodeproj -scheme AgentChatDemo-iOS -destination "id=$device" \
            -skip-testing:AgentChatDemoUITests/DemoUITests/testReadmeScreenshots -quiet
