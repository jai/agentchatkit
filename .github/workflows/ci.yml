name: ci
on:
  push:
    branches: [main]
  pull_request:
# One run at a time on main. A run in progress always finishes, so its commit can be released. A newer push
# replaces a run that is still waiting to start: the hourly release takes the newest green commit anyway.
concurrency:
  # A release commit gets a group of its own, so a newer push never replaces its waiting run and the release can tag.
  # Other pushes share one group: the newest waiting run replaces older waiting ones. Pull requests group by ref.
  group: "ci-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'chore(main): release') && github.sha || 'main' }}"
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    # make lint typecheck: SwiftFormat and SwiftLint with this repo's rules and the rules of the libraries it builds
    # on (.swiftlint.yml's parent_config), such as DurableNetworking's no_direct_networking; oxfmt, oxlint and
    # swift build; ruff and Pyrefly.
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: make setup
      - run: make lint typecheck

  api:
    # Apps take every release (`from:` ranges): a change adds to the public API and never removes or changes it
    # (AGENTS.md). Compares every library product with the latest release; a failure here stops the release.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No public API break since the latest release
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          echo "Comparing with $tag"
          swift package diagnose-api-breaking-changes "$tag"

  test:
    name: Unit Tests
    # GitHub's own Mac runner: free for a public repo.
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      # AgentChatLive's tests follow the server package's dev host. CI starts it, rather than the test process
      # (launching node from inside swift test died with SIGBUS on the macOS 26 runner).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node server/dev/host.ts --port 8789 > "$RUNNER_TEMP/dev-host.log" 2>&1 &
      - run: make setup
      # swift test (the live suites on the dev host included), the server package's tests and the protocol fixtures
      # check. The live suites' SIGBUS on the macOS 26 runtime is fixed (jai/agentchatkit#3), so they count again.
      - run: make test
        env:
          AGENTCHAT_DEV_HOST: http://127.0.0.1:8789
      # A test process that crashes says nothing in the log: print its crash report.
      - name: Crash reports
        if: failure()
        run: |
          # shellcheck disable=SC2012 # the two newest: ls -t sorts by time
          for report in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -2); do
            echo "== $report"; head -c 12000 "$report"; echo
          done
  demo:
    # The demo app builds for the Mac, and its UI tests walk the chat's main flows on an iPhone simulator. 60 minutes:
    # with a failed test's second try the job ran past 40, and GitHub reports a job over its limit as cancelled.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
        working-directory: Demo
      # The Live chat follows the server package's dev host.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node server/dev/host.ts --port 8788 > "$RUNNER_TEMP/dev-host.log" 2>&1 &
      - name: Build the Mac app
        working-directory: Demo
        run: xcodebuild build -project AgentChatDemo.xcodeproj -scheme AgentChatDemo-macOS -destination 'platform=macOS' -quiet
      - run: mkdir -p tmp/demo-screens
      - name: UI tests on an iPhone
        env:
          TEST_RUNNER_CHATDEMO_SCREENSHOTS: ${{ github.workspace }}/tmp/demo-screens
        working-directory: Demo
        run: |
          device=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl io "$device" recordVideo --codec h264 "$GITHUB_WORKSPACE/tmp/demo-motion.mov" &
          recorder=$!
          finish_recording() {
            kill -INT "$recorder" 2>/dev/null || true
            wait "$recorder" || true
            if /usr/bin/avconvert --source "$GITHUB_WORKSPACE/tmp/demo-motion.mov" --preset Preset960x540 \
              --output "$GITHUB_WORKSPACE/tmp/demo-screens/shared-chat-motion.mov" --replace; then
              rm "$GITHUB_WORKSPACE/tmp/demo-motion.mov"
            fi
          }
          trap finish_recording EXIT
          # A test that fails is tried once more and passes if either try does: on this hosted runner a different
          # iPhone test failed once in each of two runs and passed everywhere else. The next step names every
          # test that needed the second try; one that keeps needing it gets fixed.
          xcodebuild test -project AgentChatDemo.xcodeproj -scheme AgentChatDemo-iOS -destination "id=$device" \
            -skip-testing:AgentChatDemoUITests/DemoUITests/testReadmeScreenshots \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$GITHUB_WORKSPACE/tmp/demo-ui.xcresult" -quiet
      - name: Tests that needed a second try
        if: always()
        run: |
          [ -d tmp/demo-ui.xcresult ] || exit 0
          xcrun xcresulttool get test-results tests --path tmp/demo-ui.xcresult > "$RUNNER_TEMP/tests.json"
          jq -r '.. | objects | select(.nodeType? == "Test Case")
            | select([.children[]? | select(.nodeType == "Repetition" and .result == "Failed")] | length > 0)
            | "::warning::\(.name) failed a try (\(.result) in the end)"' "$RUNNER_TEMP/tests.json"
          # -quiet hides why a test failed: print each failure's message, with its test.
          jq -r '.. | objects | select(.nodeType? == "Test Case") | .name as $test
            | .. | objects | select(.nodeType? == "Failure Message") | "\($test): \(.name)"' "$RUNNER_TEMP/tests.json" \
            | sort -u | head -40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-chat-screens
          path: tmp/demo-screens
          if-no-files-found: ignore

  mac-ui:
    # Hosted Mac: this public package uses GitHub's free runners.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
        working-directory: Demo
      # The Live chat follows the server package's dev host.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node server/dev/host.ts --port 8788 > "$RUNNER_TEMP/dev-host.log" 2>&1 &
      - name: Exercise native Mac chat controls
        working-directory: Demo
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          xcodebuild test -project AgentChatDemo.xcodeproj -scheme AgentChatDemo-macOS \
            -destination 'platform=macOS' -parallel-testing-enabled NO \
            -resultBundlePath "$GITHUB_WORKSPACE/tmp/mac-ui.xcresult" -quiet
      - name: Export rendered Mac pictures
        if: always()
        run: |
          if [ -d tmp/mac-ui.xcresult ]; then
            xcrun xcresulttool export attachments --path tmp/mac-ui.xcresult --output-path tmp/mac-ui-attachments
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-chat-mac-screens
          path: tmp/mac-ui-attachments
          if-no-files-found: ignore
