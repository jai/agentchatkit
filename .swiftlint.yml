# Rules from the libraries this repo builds on, pinned to a release. DurableNetworking's rules
# keep every network call inside DurableNetworking.
parent_config: https://raw.githubusercontent.com/jai/durable-networking/v0.2.0/swiftlint/hosts.yml

included:
  - Sources
  - Tests
  - Demo/Sources
  - Demo/UITests

excluded:
  - .build
  - Demo/build

reporter: xcode

# make lint runs SwiftLint with --strict, so a warning fails. The limits below were set when it first ran that way
# (2026-11-16), so the code as it was passes; lower one once the code under it shrinks.
line_length:
  warning: 150
  error: 160
  ignores_comments: true
file_length:
  warning: 700
type_body_length:
  warning: 350
function_body_length:
  warning: 70
cyclomatic_complexity:
  warning: 20

identifier_name:
  excluded:
    - id
    - x
    - y
    - at
    # The design scale's steps.
    - xs
    - sm
    - md
    - lg
    - ms
type_name:
  excluded:
    - ID

# `CodingKeys` inside a namespaced request/response type is two levels deep.
nesting:
  type_level: 2

disabled_rules:
  - todo
  # SwiftFormat owns commas (.swiftformat --commas always), so the two tools cannot disagree.
  - trailing_comma
  # SwiftUI-style APIs take several closures, and the demo shows them as an app writes them.
  - multiple_closures_with_trailing_closure
  # String(decoding:as:) is meant: the dev host's output is read leniently, never dropped.
  - optional_data_string_conversion
