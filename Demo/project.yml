# The AgentChatKit demo: a scripted agent in an iPhone and a Mac app, on the package at this repo's root.
# `xcodegen` here writes AgentChatDemo.xcodeproj (not committed; see .gitignore).
name: AgentChatDemo
options:
  bundleIdPrefix: com.govindani.agentchatdemo
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  AgentChatKit:
    path: ..
  DurableNetworking:
    url: https://github.com/jai/durable-networking
    from: 0.1.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Builds from a fresh clone with no team: ad hoc on the Mac, none needed in the Simulator.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  AgentChatDemo:
    type: application
    platform: [iOS, macOS]
    sources: [Sources]
    dependencies:
      - package: AgentChatKit
        product: AgentChatKit
      - package: AgentChatKit
        product: AgentChatLive
      - package: AgentChatKit
        product: AgentChatLiveTesting
      - package: DurableNetworking
        product: DurableNetworking
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.govindani.agentchatdemo
        PRODUCT_NAME: AgentChat Demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AgentChat Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Attach a screenshot to a message.
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readonly
  AgentChatDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests, SharedUITests]
    dependencies:
      - target: AgentChatDemo_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.govindani.agentchatdemo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AgentChatDemo_iOS
  AgentChatDemoMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [MacUITests, SharedUITests]
    dependencies:
      - target: AgentChatDemo_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.govindani.agentchatdemo.macuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AgentChatDemo_macOS
schemes:
  AgentChatDemo-iOS:
    build:
      targets:
        AgentChatDemo_iOS: all
    test:
      targets: [AgentChatDemoUITests]
  AgentChatDemo-macOS:
    build:
      targets:
        AgentChatDemo_macOS: all
    test:
      targets: [AgentChatDemoMacUITests]
